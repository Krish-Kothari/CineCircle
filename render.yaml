services:
  - type: web
    name: cinecircle-api
    runtime: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: OMDB_API_KEY
        sync: false
      - key: OMDB_API_BASE
        value: https://www.omdbapi.com/
